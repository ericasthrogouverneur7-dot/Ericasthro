<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ERICASTHRO — Boutique officielle.">
<title>ERICASTHRO — Boutique officielle</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #090909;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 25px 15px;
  text-align: center;
  border-bottom: 1px solid #333;
}

header h1 {
  letter-spacing: 5px;
  font-size: 28px;
}

header p {
  color: #aaa;
  margin-top: 8px;
}

.hero {
  text-align: center;
  padding: 45px 15px;
}

.hero h2 {
  font-size: 30px;
  margin-bottom: 15px;
}

.hero p {
  color: #bbb;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 20px;
}

.product {
  background: #151515;
  border: 1px solid #333;
  border-radius: 12px;
  padding: 20px;
}

.product img {
  width: 100%;
  border-radius: 8px;
  display: block;
  margin-bottom: 20px;
}

.product h2 {
  margin-bottom: 10px;
}

.price {
  color: #d5b36a;
  font-size: 22px;
  margin: 15px 0;
}

label {
  display: block;
  margin: 18px 0 8px;
  font-weight: bold;
}

select, input {
  width: 100%;
  padding: 13px;
  background: #222;
  color: white;
  border: 1px solid #555;
  border-radius: 6px;
}

.colors {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.color-option {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 3px solid #777;
  cursor: pointer;
}

.color-option.active {
  outline: 2px solid white;
  outline-offset: 3px;
}

.yellow { background: yellow; }
.blue { background: blue; }
.white { background: white; }
.black { background: black; }
.pink { background: pink; }

#colorName {
  color: #d5b36a;
  margin-top: 10px;
}

button {
  width: 100%;
  padding: 15px;
  background: #d5b36a;
  color: black;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
  margin-top: 20px;
}

button:hover {
  background: white;
}

footer {
  text-align: center;
  padding: 30px 10px;
  color: #888;
  margin-top: 30px;
}
</style>
</head>

<body>

<header>
  <h1>ERICASTHRO</h1>
  <p>LE STYLE AFRICAIN • L'ÉLÉGANCE</p>
</header>

<section class="hero">
  <h2>BIENVENUE CHEZ ERICASTHRO</h2>
  <p>Découvrez notre collection exclusive.</p>
</section>

<main class="container">

  <div class="product">

    <img src="pull-ericasthro-blanc.png"
         alt="Pull ERICASTHRO">

    <h2>Hoodie Signature ERICASTHRO</h2>

    <p>Un style élégant et moderne pour toutes les occasions.</p>

    <p class="price">10 000 à 15 000 FCFA</p>

    <label>Choisir le prix</label>
    <select id="price">
      <option value="10000">10 000 FCFA</option>
      <option value="15000">15 000 FCFA</option>
    </select>

    <label>Choisir une couleur</label>

    <div class="colors">
      <button type="button" class="color-option yellow"
        aria-label="Jaune" onclick="selectColor('Jaune', this)"></button>

      <button type="button" class="color-option blue"
        aria-label="Bleu" onclick="selectColor('Bleu', this)"></button>

      <button type="button" class="color-option white active"
        aria-label="Blanc" onclick="selectColor('Blanc', this)"></button>

      <button type="button" class="color-option black"
        aria-label="Noir" onclick="selectColor('Noir', this)"></button>

      <button type="button" class="color-option pink"
        aria-label="Rose" onclick="selectColor('Rose', this)"></button>
    </div>

    <p id="colorName">Couleur choisie : Blanc</p>

    <label>Choisir la taille</label>
    <select id="size">
      <option>S</option>
      <option>M</option>
      <option>L</option>
      <option>XL</option>
      <option>XXL</option>
    </select>

    <label>Quantité</label>
    <input type="number" id="quantity"
      min="1" max="4" value="1">

    <button type="button" onclick="orderProduct()">
      COMMANDER SUR WHATSAPP
    </button>

  </div>

</main>

<footer>
  <p>© 2026 ERICASTHRO — Tous droits réservés.</p>
</footer>

<script>
let selectedColor = "Blanc";

function selectColor(color, button) {
  selectedColor = color;

  document.getElementById("colorName").textContent =
    "Couleur choisie : " + color;

  document.querySelectorAll(".color-option").forEach(function(item) {
    item.classList.remove("active");
  });

  button.classList.add("active");
}

function orderProduct() {
  const price = document.getElementById("price").value;
  const size = document.getElementById("size").value;
  const quantity = document.getElementById("quantity").value;

  if (quantity < 1 || quantity > 4) {
    alert("Choisissez une quantité entre 1 et 4.");
    return;
  }

  const total = Number(price) * Number(quantity);

  const message =
    "Bonjour ERICASTHRO, je souhaite commander :\n\n" +
    "Article : Hoodie Signature ERICASTHRO\n" +
    "Couleur : " + selectedColor + "\n" +
    "Taille : " + size + "\n" +
    "Quantité : " + quantity + "\n" +
    "Prix unitaire : " + price + " FCFA\n" +
    "Total : " + total + " FCFA";

  const whatsapp =
    "https://wa.me/2250151374759?text=" +
    encodeURIComponent(message);

  window.open(whatsapp, "_blank");
}
</script>

</body>
  </html>
